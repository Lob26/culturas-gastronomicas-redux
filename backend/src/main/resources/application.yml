spring:
  application:
    name: culturas

  # Hilos virtuales para el pool de peticiones. El trabajo pesado de este
  # servicio es I/O (Postgres, Redis, MinIO, HTTP saliente del verificador de
  # enlaces), justo el caso para el que sirven. Ojo: NO se usan para el cálculo
  # de similitud coseno de la Fase 4, que es puro CPU y ahí sólo añaden
  # sobrecarga de planificación.
  threads:
    virtual:
      enabled: true

  datasource:
    # Puerto 55432, no 5432: esta máquina ya tiene un Postgres propio escuchando
    # en 5432 y no se toca. Windows además reporta un puerto ocupado como
    # "Permission denied", no como "address in use", así que el choque no era
    # evidente en el log.
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:55432}/${POSTGRES_DB:culturas}
    username: ${POSTGRES_USER:culturas}
    password: ${POSTGRES_PASSWORD:culturas}
    hikari:
      # Postgres admite escrituras concurrentes de verdad, así que el pool se
      # dimensiona por CPU y no por la limitación de un único escritor.
      maximum-pool-size: 16
      minimum-idle: 4
      connection-timeout: 10000
      pool-name: culturas-pool

  jpa:
    hibernate:
      # Flyway es el dueño único del esquema. Con `validate` Hibernate se
      # atragantaría con los índices GIN y las columnas vector de pgvector.
      ddl-auto: none
    # El proyecto de 2023 lo tenía en true, y eso era precisamente lo que hacía
    # que los endpoints /all "funcionaran": las colecciones perezosas se
    # resolvían durante la serialización JSON, un N+1 por cada entidad. En false
    # ese error falla ruidosamente en desarrollo en vez de degradar en producción.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 25
          time_zone: UTC
        order_inserts: true
        order_updates: true
        query:
          in_clause_parameter_padding: true
          fail_on_pagination_over_collection_fetch: true
        # Deja rastro en el log cuando una consulta trae una colección entera a
        # memoria para paginarla; es el síntoma clásico de un fetch mal planteado.
        log:
          slow_query: 500

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  mvc:
    # Respuestas de error en formato RFC 9457 (application/problem+json) para
    # las excepciones propias de Spring MVC. Las del dominio las traduce
    # GlobalExceptionHandler.
    problemdetails:
      enabled: true

  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 12MB

  ai:
    # Qué autoconfiguración de IA se activa para cada tipo de modelo.
    #
    # Es obligatorio fijarlo: el starter de Ollama trae TAMBIÉN un
    # OllamaEmbeddingModel, así que con el de transformers en el classpath
    # habría dos beans EmbeddingModel y el arranque fallaría por ambigüedad.
    # Los embeddings se quedan en transformers —van incrustados en la JVM y no
    # necesitan que Ollama esté levantado, cosa que la búsqueda sí necesita en
    # cada consulta— y el chat va a Ollama.
    model:
      embedding: transformers
      chat: ollama

    ollama:
      base-url: ${OLLAMA_URL:http://localhost:11434}
      init:
        # Que NO intente descargar el modelo al arrancar. Con `always`, un
        # primer arranque sin el modelo se queda minutos bajando gigas antes de
        # abrir el puerto, y sin Ollama levantado falla directamente. Descargarlo
        # es un paso explícito: `task llm:pull`.
        pull-model-strategy: never
      chat:
        options:
          # 4B cuantizado, ~2,5 GB. Se ejecuta dentro del test end-to-end y no
          # sirve tráfico continuo, así que pesa más que descargue y arranque
          # rápido que su techo de calidad. Subir a 8b es cambiar esta línea.
          model: ${OLLAMA_MODEL:qwen3:4b}
          # Baja a propósito: esto es responder con unas fuentes delante, no
          # escribir. Con la temperatura por defecto el modelo adorna, y adornar
          # aquí significa decir cosas que las fuentes no dicen.
          temperature: 0.2

    embedding:
      transformer:
        # El modelo por defecto de Spring AI es all-MiniLM-L6-v2, que es
        # SÓLO inglés. Aquí no sirve: el catálogo está íntegramente en español
        # y con ese modelo «algo picante con maíz» y «tortilla de chile»
        # caerían en zonas distintas del espacio vectorial.
        #
        # paraphrase-multilingual-MiniLM-L12-v2 cubre 50 idiomas, produce las
        # mismas 384 dimensiones (así que la columna vector(384) no cambia) y
        # está exportado a ONNX por Xenova.
        onnx:
          model-uri: https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/onnx/model_quantized.onnx
        tokenizer:
          uri: https://huggingface.co/Xenova/paraphrase-multilingual-MiniLM-L12-v2/resolve/main/tokenizer.json
        # Cuantizado (~118 MB) y no fp32 (~470 MB). Se eligió por tamaño de
        # descarga, no por calidad medida: NO se ha comparado contra el fp32.
        # Con este corpus las consultas de SearchQualityTest aciertan, así que
        # no hay evidencia de que la cuantización estorbe — pero tampoco de lo
        # contrario, y conviene no confundir las dos cosas. Si alguna vez el
        # ranking se degrada, este es el primer parámetro que hay que probar a
        # cambiar; el segundo es qué texto se indexa (ver VectorRepository).
        cache:
          enabled: true
          # Descarga única. Ojo: el modelo se carga en el arranque, no en la
          # primera consulta, así que el primer `bootRun` de una máquina limpia
          # tarda lo que tarde la descarga.
          directory: ${user.home}/.cache/culturas/onnx

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080
  error:
    # Nunca exponer stack traces al cliente: el whitelabel de Spring filtraba
    # detalles internos en el proyecto original.
    include-stacktrace: never
    include-message: never
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/problem+json,text/event-stream

springdoc:
  api-docs:
    path: /v3/api-docs
    version: openapi_3_1
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

culturas:
  media:
    endpoint: http://${MINIO_HOST:localhost}:${MINIO_PORT:9000}
    bucket: ${MINIO_BUCKET:culturas-media}
    access-key: ${MINIO_ROOT_USER:minioadmin}
    secret-key: ${MINIO_ROOT_PASSWORD:minioadmin}
  security:
    # Terraform lo genera y lo escribe en .env. El valor de reserva sólo sirve
    # para arrancar sin infraestructura (tests de slice); no protege nada.
    jwt-secret: ${JWT_SECRET:clave-solo-para-desarrollo-local-sin-valor}
    jwt-ttl: 12h
    api-key: ${CULTURAS_API_KEY:dev-api-key-change-me}
    allowed-origins:
      - http://localhost:4200
  assistant:
    # Cuántos documentos del catálogo se le pasan como contexto. Más contexto no
    # es mejor respuesta: con el catálogo entero dentro, el modelo tiende a
    # resumirlo en vez de responder lo que se le preguntó. Y con un modelo local
    # pequeño el efecto es más acusado, porque su ventana útil es menor que la
    # nominal.
    context-size: 6
    timeout: 4m
  jobs:
    link-check:
      # Tope explícito del fan-out. Sin esto los hilos virtuales crearían miles
      # de peticiones simultáneas y el cuello de botella pasaría a ser la red
      # del host, no el servicio.
      max-concurrency: 32
      request-timeout: 8s

logging:
  level:
    root: INFO
    co.edu.uniandes.culturas: DEBUG

---
# Perfil de tests: las migraciones y el esquema se aplican contra el Postgres
# efímero que levanta Testcontainers, no contra el stack de desarrollo.
spring:
  config:
    activate:
      on-profile: test
  jpa:
    properties:
      hibernate:
        # En tests sí interesa ver el SQL cuando algo falla.
        format_sql: true
logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
