version: '3'

# Punto de entrada único del monorepo. Un backend Maven y un frontend Angular no
# comparten herramienta de build, así que en lugar de meter un orquestador de JS
# que sólo gobernaría la mitad del repo, Task envuelve a los dos.
#
# Requisitos: podman (o docker), JDK 25, Node 22+.
#   task setup   -> arranca la VM de Podman y levanta el stack
#   task dev     -> backend + frontend en paralelo
#   task verify  -> todo lo que corre en CI

vars:
  # Terraform es la única fuente de verdad de la infraestructura; no hay
  # compose.yml. Ver infra/.
  TF: '{{.TF | default "terraform"}}'
  TFDIR: infra
  CONTAINER: '{{.CONTAINER | default "podman"}}'
  BACKEND: backend
  FRONTEND: frontend
  # 4B cuantizado, ~2.5 GB. El modelo se ejecuta una vez dentro del test
  # end-to-end, no sirve tráfico continuo, así que lo que importa es que se
  # descargue y arranque rápido, no su techo de calidad. Subir a 8b es
  # cambiar esta línea (y OLLAMA_MODEL en el entorno del backend).
  LLM_MODEL: '{{.LLM_MODEL | default "qwen3:4b"}}'
  # Invocación del wrapper de Maven. En Windows hace falta este rodeo, y cada
  # pieza de él responde a un fallo concreto:
  #
  #   - `./mvnw.cmd` NO vale. Al ejecutar un .cmd, Windows lo pasa por cmd.exe,
  #     que no entiende `./` y responde «'.' is not recognized as an internal
  #     or external command».
  #   - `mvnw.cmd` a secas tampoco. El shell POSIX de Task sólo busca en $PATH,
  #     no en el directorio actual: «executable file not found in $PATH».
  #   - `cmd /C mvnw.cmd` tampoco, y este es el menos evidente: cmd busca en el
  #     directorio actual salvo que esté definida la variable de entorno
  #     NoDefaultCurrentDirectoryInExePath, que en algunos entornos —este, sin
  #     ir más lejos— viene puesta a 1.
  #
  # Queda `cmd /C .\mvnw.cmd`, con la ruta relativa explícita. Las cuatro
  # barras invertidas son dos desescapados encadenados: la plantilla de Task
  # deja dos, y el shell deja una.
  #
  # Esto dejaba rotas TODAS las tareas de Maven —seed, backend:dev,
  # backend:test, backend:verify, migrate:info— y no se había notado porque
  # durante el desarrollo el backend se arrancó siempre invocando el wrapper a
  # mano. Salió a la luz al reconstruir el stack desde cero tras un `nuke`.
  MVNW: '{{if eq OS "windows"}}cmd /C .\\\\mvnw.cmd{{else}}./mvnw{{end}}'

  # Conexión para el plugin de Flyway. Las variables salen del .env de
  # Terraform vía `dotenv`, y se expanden en el shell —no en la plantilla—
  # porque Task resuelve las plantillas antes de que exista el entorno.
  FLYWAY_ARGS: >-
    -Dflyway.url=jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    -Dflyway.user=${POSTGRES_USER}
    -Dflyway.password=${POSTGRES_PASSWORD}
    -Dflyway.locations=classpath:db/migration

# Las credenciales salen del .env que genera `terraform apply`, no de valores
# fijos aquí. Terraform crea la contraseña de Postgres con random_password, así
# que un `POSTGRES_PASSWORD: culturas` escrito a mano no coincide con la que la
# base tiene de verdad y `task backend:dev` muere con
# «password authentication failed for user "culturas"» — un fallo que parece de
# configuración del backend cuando en realidad es de esta línea.
#
# `dotenv` y no `env`: en Task, `env` gana sobre `dotenv`, de modo que declarar
# aquí los mismos nombres volvería a pisar los valores reales.
dotenv: ['.env']

tasks:
  default:
    desc: Lista las tareas disponibles
    cmds:
      - task --list
    silent: true

  # ---------------------------------------------------------------- entorno --

  setup:
    desc: "Primera vez: arranca la VM de Podman, levanta el stack y siembra datos"
    cmds:
      - task: machine:up
      - task: up
      - task: seed
      - cmd: echo ""
      - cmd: echo "Listo. API http://localhost:8080  ·  MinIO http://localhost:9001  ·  n8n http://localhost:5678"

  machine:up:
    desc: Crea (si hace falta) e inicia la máquina de Podman
    cmds:
      # Ambos comandos fallan si la VM ya existe o ya está corriendo, que es el
      # caso normal a partir de la segunda vez. Se ignoran los errores en vez de
      # consultar el estado porque `podman machine list` no ofrece un código de
      # salida distinto para "existe" y su formato de salida cambia entre versiones.
      # La VM se limita a 6 GB: el host tiene 15.3 GB y fuera de los contenedores
      # todavía corren la JVM y el dev server de Angular.
      - cmd: '{{.CONTAINER}} machine init --cpus 4 --memory 6144 --disk-size 60'
        ignore_error: true
      - cmd: '{{.CONTAINER}} machine start'
        ignore_error: true

  infra:init:
    desc: Descarga los proveedores de Terraform
    cmds:
      - '{{.TF}} -chdir={{.TFDIR}} init -input=false'

  containers:start:
    internal: true
    desc: Arranca los contenedores que ya existan pero estén parados
    cmds:
      # Hace falta ANTES de `terraform apply`, y el motivo es un huevo-y-gallina
      # del propio diseño: los proveedores de postgresql y minio se conectan a
      # los servicios durante el plan, para leer el estado de roles, bases y
      # buckets. Esos servicios son contenedores que gestiona el mismo
      # Terraform, así que tras un `task down` —que para la VM y con ella los
      # contenedores— el plan falla con «connection refused» antes de llegar a
      # arrancarlos.
      #
      # La base PRIMERO y sola. Arrancarlo todo a la vez provoca una carrera:
      # n8n guarda su estado en Postgres y se cae al instante si aún no acepta
      # conexiones —«connect ECONNREFUSED 10.89.0.2:5432»— dejando el
      # contenedor en Exited(1) y el puerto 5678 muerto, mientras los demás
      # parecen sanos. El `depends_on` de Terraform ordena la CREACIÓN, no un
      # `podman start` posterior.
      # Arrancar contenedores parados tras apagar la VM tiene DOS fallos de red
      # de netavark, los dos silenciosos:
      #
      #   - alguno queda corriendo sin IP ninguna;
      #   - o peor, dos reciben la MISMA IP. Visto: n8n y Postgres ambos en
      #     10.89.0.2, de modo que n8n se conectaba a sí mismo y moría con
      #     «connect ECONNREFUSED 10.89.0.2:5432».
      #
      # En los dos casos `podman ps` los muestra Up y no hay ningún error: sólo
      # se nota porque el puerto 5678 no responde mientras el resto parece sano.
      # Pararlos TODOS y volver a arrancarlos en orden libera las concesiones y
      # reparte direcciones únicas.
      #
      # Se hace sólo si hace falta —si falta alguno por arrancar o si las IPs no
      # son únicas— para no reiniciar un stack sano: `task up` puede ejecutarse
      # con el backend conectado, y reiniciar Poststgres le rompería el pool.
      - |
        FILTRO="label=managed-by=terraform"
        total=$({{.CONTAINER}} ps -aq --filter "$FILTRO" | wc -l | tr -d ' ')
        [ "$total" -eq 0 ] && exit 0   # primer arranque: aún no hay nada

        vivos=$({{.CONTAINER}} ps -q --filter "$FILTRO" | wc -l | tr -d ' ')
        ips=$({{.CONTAINER}} ps -q --filter "$FILTRO" | while read -r id; do
                {{.CONTAINER}} inspect "$id" --format '{{"{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}"}}'
              done)
        unicas=$(printf '%s\n' "$ips" | grep -v '^$' | sort -u | wc -l | tr -d ' ')

        if [ "$vivos" -ne "$total" ] || [ "$unicas" -ne "$vivos" ]; then
          echo "  Reiniciando los contenedores en orden (faltan o comparten IP)"
          {{.CONTAINER}} stop $({{.CONTAINER}} ps -aq --filter "$FILTRO") >/dev/null 2>&1 || true
          {{.CONTAINER}} start culturas-database >/dev/null 2>&1 || true
          {{.CONTAINER}} exec culturas-database sh -c 'until pg_isready -q; do sleep 1; done' >/dev/null 2>&1 || true
          {{.CONTAINER}} start $({{.CONTAINER}} ps -aq --filter "$FILTRO") >/dev/null 2>&1 || true
        fi

  infra:plan:
    desc: Muestra qué cambiaría sin aplicar nada
    cmds:
      - '{{.TF}} -chdir={{.TFDIR}} plan'

  infra:fmt:
    desc: Formatea y valida el HCL
    cmds:
      - '{{.TF}} -chdir={{.TFDIR}} fmt -recursive'
      - '{{.TF}} -chdir={{.TFDIR}} validate'

  up:
    desc: Aplica la infraestructura (postgres, redis, minio, n8n) y genera el .env
    deps: [infra:init]
    # `deps` corre en paralelo, así que arrancar los contenedores va aquí, en
    # cmds, para garantizar que sucede ANTES del apply y no a la vez.
    vars:
      # Sólo en Podman para Windows: los contenedores corren dentro de una VM de
      # WSL2, así que `host.containers.internal` apunta a la puerta de enlace de
      # esa VM y no a Windows, que es donde escucha el backend. Se detecta la
      # dirección buena en vez de fijarla, porque WSL la reasigna al reiniciar.
      # En Linux el comando no existe, la variable queda vacía y Terraform usa
      # su valor por defecto, que allí sí es correcto.
      HOST_GATEWAY:
        sh: podman machine ssh "ip route | awk '/default/{print $3}'" 2>/dev/null | tr -d '\r' || true
    cmds:
      # `down` para la VM, así que `up` tiene que levantarla: si no, la pareja
      # up/down es asimétrica y el segundo `up` falla con «open
      # //./pipe/docker_engine: The system cannot find the file specified»,
      # un mensaje sobre privilegios de Docker que no tiene nada que ver con lo
      # que pasa —simplemente no hay VM—.
      - task: machine:up
      # Antes del apply: los proveedores de postgresql y minio se conectan
      # durante el PLAN, así que sus servicios tienen que estar en pie.
      - task: containers:start
      - '{{.TF}} -chdir={{.TFDIR}} apply -input=false -auto-approve {{if .HOST_GATEWAY}}-var="host_api_url=http://{{.HOST_GATEWAY}}:8080"{{end}}'
      # Y DESPUÉS también. El apply recrea el contenedor de n8n en cada
      # ejecución —lleva la puerta de enlace de la VM en su entorno y WSL la
      # reasigna en cada reinicio—, de modo que puede dejarlo parado o sin red
      # justo después de que la primera pasada lo hubiera dejado bien. Esta
      # segunda pasada no hace nada si todo quedó sano.
      - task: containers:start
      - '{{.TF}} -chdir={{.TFDIR}} output -json urls'

  down:
    desc: "Devuelve la máquina: para la VM de Podman y libera su memoria (conserva los datos)"
    cmds:
      # Apagar la VM basta: los contenedores se paran con ella y la memoria
      # vuelve al anfitrión, que es lo único que `down` promete.
      #
      # Antes esto destruía además los contenedores con `terraform destroy
      # -target`, y no funcionaba: -target arrastra también lo que DEPENDE del
      # objetivo, así que se llevaba por delante postgresql_extension y el
      # borrado moría con «cannot drop extension vector because other objects
      # depend on it» — en cuanto V5 crea recipe.embedding, el tipo `vector`
      # tiene dependientes.
      #
      # Y aunque hubiera funcionado, destruir los contenedores no aportaba nada
      # sobre pararlos: la imagen se queda igual y volver a levantarlos es un
      # `terraform apply`. Lo que ocupaba los 6 GB era la VM. Para destruirlo
      # todo de verdad está `task nuke`.
      - task: machine:down

  machine:down:
    desc: Apaga la VM de Podman y libera su memoria
    cmds:
      - cmd: '{{.CONTAINER}} machine stop'
        ignore_error: true

  nuke:
    desc: "DESTRUCTIVO: destruye todo, incluidos los volúmenes y sus datos"
    prompt: Esto borra los volúmenes de Postgres, MinIO y n8n con todos sus datos. ¿Continuar?
    cmds:
      - '{{.TF}} -chdir={{.TFDIR}} destroy -auto-approve'
      - task: machine:down

  # ------------------------------------------------------------------- LLM --
  # Ollama se instala desde main/ollama, que es SÓLO el binario: sin servicio,
  # sin autoarranque, sin icono en la bandeja. El paquete con demonio es otro
  # (extras/ollama-full) y no se usa a propósito — este proyecto no debe dejar
  # nada residente cuando no se está ejecutando.
  #
  #   scoop install main/ollama
  #
  # El asistente es lo único que necesita esto. Sin Ollama levantado responde
  # 503 y el resto del catálogo funciona igual.
  llm:up:
    desc: Arranca Ollama en primer plano (Ctrl-C para pararlo)
    env:
      # 0 = descarga el modelo de la VRAM en cuanto termina la respuesta. El
      # valor por defecto son 5 minutos, justo la ventana en la que uno se
      # cambia a otra cosa y se encuentra la GPU todavía ocupada.
      OLLAMA_KEEP_ALIVE: '0'
    cmds:
      - ollama serve

  llm:pull:
    desc: "Descarga el modelo local (~2.5 GB). Requiere 'task llm:up' corriendo"
    cmds:
      # `ollama pull` NO levanta el servidor: habla con uno que ya esté
      # escuchando. Se instala sólo el binario, sin servicio ni autoarranque —a
      # propósito, para no dejar nada residente— así que sin `llm:up` delante
      # esto responde «could not locate ollama app», que suena a instalación
      # rota y no lo es.
      #
      # Por eso el orden correcto es al revés de lo que parece: primero
      # `llm:up` en una terminal, y `llm:pull` en otra.
      - |
        curl -sf http://localhost:11434/api/tags >/dev/null 2>&1 || {
          echo "Ollama no está escuchando en :11434."
          echo "Arranca 'task llm:up' en otra terminal y vuelve a lanzar esto."
          exit 1
        }
      - ollama pull {{.LLM_MODEL}}

  llm:status:
    desc: Muestra qué modelos hay cargados en memoria ahora mismo
    cmds:
      # Con Ollama parado, `ollama ps` responde «could not locate ollama app»,
      # que suena a instalación rota cuando en realidad es la respuesta
      # correcta: no hay ningún modelo cargado porque no hay servidor.
      - cmd: ollama ps || echo "Ollama no está en marcha (arráncalo con 'task llm:up'); no hay modelos cargados."
        ignore_error: true

  console:
    desc: Consola web para lanzar estas mismas tareas (sólo 127.0.0.1)
    cmds:
      # Node pelado, sin dependencias ni compilación: esta herramienta tiene que
      # funcionar justo cuando no funciona nada más, así que no puede depender
      # de que el stack esté levantado.
      #
      # Imprime una URL con un token de un solo arranque. Escucha únicamente en
      # 127.0.0.1 y valida Host, Origin y token en cada llamada: es un ejecutor
      # de comandos, y tu propio navegador es la superficie de ataque.
      - node tools/console/server.mjs

  logs:
    desc: "Sigue los logs de un servicio. Uso: task logs -- culturas-database"
    cmds:
      - '{{.CONTAINER}} logs -f {{.CLI_ARGS}}'

  ps:
    desc: Estado de los contenedores del proyecto
    cmds:
      - '{{.CONTAINER}} ps --filter label=managed-by=terraform'

  psql:
    desc: Abre una sesión psql contra la base de la aplicación
    interactive: true
    cmds:
      - '{{.CONTAINER}} exec -it culturas-database psql -U $POSTGRES_USER -d $POSTGRES_DB'

  # --------------------------------------------------------------- backend ---

  backend:dev:
    dir: '{{.BACKEND}}'
    desc: Arranca el backend con recarga en caliente
    cmds:
      - '{{.MVNW}} spring-boot:run'

  backend:test:
    dir: '{{.BACKEND}}'
    desc: Tests unitarios y de slice (sin contenedores)
    cmds:
      - '{{.MVNW}} test'

  backend:verify:
    dir: '{{.BACKEND}}'
    desc: Suite completa, incluidos los tests de integración con Testcontainers
    env:
      # Ryuk es el contenedor que Testcontainers usa para recoger los suyos al
      # terminar la JVM. Con Podman NO funciona: necesita montar el socket de
      # Docker en /var/run/docker.sock, que no es donde Podman lo pone, así que
      # arranca, queda inalcanzable —«Can not connect to Ryuk at localhost:…»—
      # y no recoge nada. Se apaga para no levantar un contenedor inútil por
      # cada ejecución, y la limpieza la hace el `defer` de abajo.
      TESTCONTAINERS_RYUK_DISABLED: 'true'
    cmds:
      # `defer` corre también si los tests fallan, que es justo cuando más
      # interesa: una suite en rojo no debe además dejar basura.
      - defer: '{{.CONTAINER}} rm -f $({{.CONTAINER}} ps -aq --filter label=org.testcontainers=true) 2>/dev/null || true'
      - '{{.MVNW}} verify'

  # Las credenciales van por línea de comandos desde el .env que genera
  # Terraform. Antes las dos tareas apuntaban a un `flyway.conf` que no existe
  # en el repositorio —ni podría, porque la contraseña la crea
  # random_password— y fallaban con «Unable to load config file».
  #
  # El backend aplica las migraciones solo al arrancar; esto sirve para sembrar
  # ANTES de levantarlo (que es lo que hace `task setup`) y para consultar el
  # estado sin arrancarlo.
  seed:
    dir: '{{.BACKEND}}'
    desc: Aplica las migraciones y carga los datos de ejemplo
    cmds:
      # `process-resources` ANTES de migrar, y no es opcional: las migraciones se
      # leen de `classpath:db/migration`, que es target/classes, no src. Sin
      # copiarlas primero, Flyway aplica la versión ANTERIOR de los archivos y
      # dice que todo fue bien —una migración nueva sencillamente no existe para
      # él—. Es el peor fallo posible aquí: silencioso y con exit 0.
      - '{{.MVNW}} -q process-resources flyway:migrate {{.FLYWAY_ARGS}}'

  reindex:
    desc: Calcula los embeddings pendientes del catálogo (requiere el backend arriba)
    cmds:
      # Idempotente: sólo toca lo que no tiene vector o lo tiene desactualizado,
      # así que repetirlo no cuesta nada.
      # Entrecomillado: sin las comillas simples exteriores, YAML ve los dos
      # puntos de «X-API-Key:» y lo interpreta como un mapa, no como un comando.
      - 'curl -sf -X POST http://localhost:8080/api/v2/jobs/reindexar -H "X-API-Key: $CULTURAS_API_KEY"'

  migrate:info:
    dir: '{{.BACKEND}}'
    desc: Muestra el estado de las migraciones de Flyway
    cmds:
      # Mismo motivo que en `seed`: sin process-resources, el informe describe
      # las migraciones que había en el último build, no las del código fuente.
      - '{{.MVNW}} -q process-resources flyway:info {{.FLYWAY_ARGS}}'

  # -------------------------------------------------------------- frontend ---

  frontend:dev:
    dir: '{{.FRONTEND}}'
    desc: Dev server de Angular
    cmds:
      - npm start

  frontend:test:
    dir: '{{.FRONTEND}}'
    cmds:
      - npx ng test

  frontend:build:
    dir: '{{.FRONTEND}}'
    cmds:
      - npx ng build

  e2e:
    dir: '{{.FRONTEND}}'
    desc: Tests end-to-end con Playwright
    cmds:
      - npx playwright test

  # ------------------------------------------------------------------ spec --

  spec:
    desc: Descarga el OpenAPI del backend (requiere el backend arriba)
    cmds:
      # Sin el `||`, con el backend parado esto sale con «exit status 7», que es
      # el código de curl para «no pude conectar» y no se lo sabe nadie.
      - >-
        curl -sf http://localhost:8080/v3/api-docs -o {{.FRONTEND}}/openapi.json
        || { echo "No respondió http://localhost:8080. ¿Está corriendo 'task backend:dev'?"; exit 1; }

  # ------------------------------------------------------------------- n8n --

  n8n:import:
    desc: Importa a n8n los workflows versionados en workflows/
    cmds:
      - '{{.CONTAINER}} exec culturas-automation n8n import:workflow --separate --input=/workflows'

  n8n:publish:
    desc: Publica (activa) los workflows importados y reinicia n8n para que surtan efecto
    cmds:
      # n8n avisa de que los cambios no se aplican mientras está corriendo, así
      # que el reinicio es parte del procedimiento, no una precaución.
      - |
        for id in $({{.CONTAINER}} exec culturas-automation n8n list:workflow | cut -d'|' -f1); do
          {{.CONTAINER}} exec culturas-automation n8n publish:workflow --id="$id"
        done
      # Parar y arrancar por separado, NO `restart`. `podman restart` falla de
      # forma intermitente al reasignar la IP en la red de usuario, con
      # «netavark (exit code 1): no static ips provided», y deja el contenedor
      # tumbado — de modo que la siguiente tarea se encuentra un «container
      # state improper» que no menciona la causa por ninguna parte.
      - '{{.CONTAINER}} stop culturas-automation'
      - '{{.CONTAINER}} start culturas-automation'
      - task: n8n:wait

  n8n:wait:
    internal: true
    desc: Espera a que n8n vuelva a aceptar peticiones
    cmds:
      # n8n tarda unos segundos en volver tras un arranque, y hasta entonces un
      # `podman exec` contra él responde «container state improper». Esperar
      # aquí evita que la siguiente tarea falle por ir demasiado deprisa.
      - |
        for i in $(seq 1 40); do
          curl -sf "http://localhost:${N8N_PORT}/healthz" >/dev/null 2>&1 && exit 0
          sleep 2
        done
        echo "n8n no respondió en http://localhost:${N8N_PORT} tras 80 s"
        exit 1

  n8n:export:
    desc: Exporta los workflows de n8n al repo para versionarlos
    deps: [n8n:wait]
    cmds:
      # Se exporta a una ruta escribible DENTRO del contenedor y luego se copia
      # fuera, en vez de escribir directamente en /workflows.
      #
      # El montaje del repositorio es de sólo lectura a propósito (infra:
      # bind_mounts), así que exportar encima fallaba con «EROFS: read-only
      # file system» — la tarea no podía funcionar tal y como estaba escrita.
      #
      # Mantener el montaje de sólo lectura y copiar explícitamente es mejor
      # que abrirlo: n8n no debe poder reescribir el repositorio por su cuenta,
      # y traer los cambios pasa a ser un acto deliberado de quien ejecuta esto.
      - '{{.CONTAINER}} exec culturas-automation sh -c "rm -rf /tmp/wf && mkdir -p /tmp/wf && n8n export:workflow --all --separate --output=/tmp/wf"'
      - rm -rf .n8n-export && mkdir -p .n8n-export
      - '{{.CONTAINER}} cp culturas-automation:/tmp/wf/. ./.n8n-export/'
      # n8n nombra lo exportado por identificador y el repositorio lo nombra por
      # lo que hace, así que copiar sin más dejaba ocho archivos donde había
      # cuatro. Esto los empareja por el campo `id` y respeta los nombres.
      - node tools/n8n/merge-export.mjs .n8n-export workflows
      - rm -rf .n8n-export
      - cmd: echo "Revisa 'git diff workflows/' antes de commitear."
        silent: true

  # ------------------------------------------------------------------ meta --

  dev:
    desc: Backend y frontend en paralelo
    deps: [backend:dev, frontend:dev]

  verify:
    desc: Todo lo que corre en CI
    cmds:
      - task: backend:verify
      - task: frontend:build
      - task: frontend:test
      # El E2E va al final porque es el único que necesita el stack levantado.
      - task: e2e
