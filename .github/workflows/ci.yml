name: CI

# Reemplaza al Jenkinsfile de 2023, que lucía un badge verde sobre 10 de 13
# colecciones de pruebas vaciadas a mano con la descripción «Para vaciar el
# jenkins». Un CI que no puede ponerse rojo no es un CI.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una ejecución por rama: empujar tres veces seguidas no debe dejar tres builds
# compitiendo por los mismos runners.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      # `verify` y no `test` para que también corra failsafe.
      #
      # AVISO, para que nadie lea de más en este verde: hoy NO hay ningún test
      # de integración ni slice de MockMvc. Sólo hay tests unitarios —lógica
      # pura, sin Spring—, así que la fase de verificación no ejecuta nada
      # adicional. Las dependencias de Testcontainers están en el pom y failsafe
      # configurado, pero no hay *IT.java que ejecutar.
      #
      # Lo que sí cubre de verdad la frontera HTTP y la base es el job `e2e` de
      # más abajo, contra Postgres y Redis reales. Este comentario existe porque
      # un CI verde que parece probar más de lo que prueba es exactamente lo que
      # tenía el proyecto de 2023.
      - name: Compilar y probar (unitarios)
        run: ./mvnw --batch-mode verify
        working-directory: backend

      # Sube los informes aunque la build falle: si no, el único rastro de un
      # fallo es la traza recortada del log.
      - name: Publicar informes de test
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informes-backend
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` y no `npm install`: instala exactamente el lockfile y falla si
      # está desincronizado con package.json, en vez de resolverlo por su cuenta
      # y construir algo distinto de lo que se probó en local.
      - run: npm ci
        working-directory: frontend

      - name: Compilar
        run: npx ng build
        working-directory: frontend

      - name: Tests unitarios
        run: npx ng test --watch=false
        working-directory: frontend

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    # No tiene sentido levantar el stack entero si la unidad ya está rota.
    needs: [backend, frontend]

    # El E2E necesita la infraestructura de verdad. En local la levanta
    # Terraform sobre Podman; aquí se declara como servicios del job, que es lo
    # mismo con otra sintaxis y sin instalar Terraform en el runner.
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg18-trixie
        env:
          POSTGRES_DB: culturas
          POSTGRES_USER: culturas
          POSTGRES_PASSWORD: culturas
        ports: ['5432:5432']
        # Sin el healthcheck, el paso siguiente arranca en cuanto el contenedor
        # existe —no cuando Postgres acepta conexiones— y falla de forma
        # intermitente según lo cargada que esté la máquina.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      POSTGRES_HOST: localhost
      # 5432 aquí y 55432 en local: la máquina de desarrollo ya tiene otro
      # Postgres en el puerto por defecto, el runner no.
      POSTGRES_PORT: '5432'
      POSTGRES_DB: culturas
      POSTGRES_USER: culturas
      POSTGRES_PASSWORD: culturas
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      MINIO_HOST: localhost
      MINIO_PORT: '9000'
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_BUCKET: culturas-media
      JWT_SECRET: clave-de-integracion-continua-sin-valor-fuera-de-aqui
      CULTURAS_API_KEY: ci-api-key
      # No se instala Ollama en el runner: son 2,5 GB de modelo y un minuto de
      # generación por CPU para comprobar una función accesoria. Aquí el
      # asistente responde 503, y su test cubre exactamente esa degradación. El
      # camino completo se ejerce en local con `task llm:up` — ver README.
      #
      # Tampoco hay ninguna clave de API que configurar como secreto de
      # GitHub: este proyecto no llama a ningún servicio externo.

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # MinIO va como paso y no como `services`, aunque Postgres y Redis sí lo
      # sean. El motivo: los contenedores de `services` no admiten sobrescribir
      # el comando, y la imagen de MinIO necesita `server /data` — sin él
      # arranca, imprime la ayuda y se cierra. Además hace falta crear el bucket
      # después, que en local hace el proveedor aminueza/minio de Terraform.
      #
      # Misma imagen exacta que usa infra/variables.tf: un doble distinto en CI
      # probaría un MinIO que no es el que se ejecuta de verdad.
      - name: Levantar MinIO y crear el bucket
        run: |
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z server /data

          for i in $(seq 1 30); do
            curl -sf http://localhost:9000/minio/health/live && break
            sleep 2
          done

          docker run --rm --network host --entrypoint sh docker.io/minio/mc -c "
            mc alias set ci http://localhost:9000 minioadmin minioadmin &&
            mc mb --ignore-existing ci/culturas-media"

      # La extensión la crea Terraform en local, y crearla exige superusuario:
      # el rol de la aplicación no lo es ni debe serlo. Aquí hace falta el
      # equivalente manual antes de que Flyway aplique V5.
      - name: Habilitar extensiones de Postgres
        run: |
          for ext in vector pg_trgm unaccent; do
            PGPASSWORD=culturas psql -h localhost -U culturas -d culturas \
              -c "CREATE EXTENSION IF NOT EXISTS $ext;"
          done

      # El modelo de embeddings se descarga en el arranque. Cachearlo evita
      # bajar 118 MB de HuggingFace en cada ejecución y, sobre todo, evita que
      # el CI se ponga rojo porque un tercero esté caído.
      - name: Cachear el modelo ONNX
        uses: actions/cache@v4
        with:
          path: ~/.cache/culturas/onnx
          key: onnx-multilingual-minilm-l12-v2

      - run: npm ci
        working-directory: frontend

      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Arrancar el backend
        run: |
          ./mvnw --batch-mode -DskipTests spring-boot:run &
          # Espera activa contra la sonda de salud. Un `sleep 30` fijo sería a
          # la vez más lento cuando arranca rápido y más frágil cuando no.
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 5
          done
        working-directory: backend

      - name: Calcular embeddings
        run: |
          curl -sf -X POST http://localhost:8080/api/v2/jobs/reindexar \
            -H "X-API-Key: $CULTURAS_API_KEY"

      - name: Playwright
        run: npx playwright test
        working-directory: frontend

      - name: Publicar el informe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: informe-playwright
          path: frontend/playwright-report/
          if-no-files-found: ignore
