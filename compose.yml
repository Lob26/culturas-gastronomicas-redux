# Culturas Gastronómicas — stack local de desarrollo.
#
# Diseñado para Podman (rootless) en Windows vía WSL2, pero es Compose Spec
# estándar y funciona igual con Docker. Las imágenes van con nombre totalmente
# cualificado porque Podman, a diferencia de Docker, no asume docker.io.
#
# Presupuesto de memoria: la máquina tiene 15.3 GB y la VM de Podman está
# limitada a 6 GB, así que cada servicio lleva un límite explícito. La suma es
# ~3.3 GB y deja aire para la JVM y el dev server de Angular, que corren fuera
# de los contenedores.

name: culturas

services:
  postgres:
    image: docker.io/pgvector/pgvector:0.8.6-pg18-trixie
    container_name: culturas-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-culturas}
      POSTGRES_USER: ${POSTGRES_USER:-culturas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-culturas}
      # Sin esto Postgres inicializa el cluster en inglés y los mensajes de
      # error de las constraints salen mezclados con el resto de logs en es-CO.
      LANG: en_US.utf8
    ports:
      # 55432 en el host porque 5432 ya está ocupado por otro Postgres local.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Sólo corre la primera vez, cuando el volumen está vacío. Crea las
      # extensiones; el esquema es responsabilidad exclusiva de Flyway.
      - ./infra/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-culturas} -d ${POSTGRES_DB:-culturas}"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    # Postgres usa memoria compartida para hash joins y sorts paralelos; el
    # default de 64 MB provoca "could not resize shared memory segment" en
    # cuanto una query de búsqueda híbrida abre varios workers.
    shm_size: 256mb
    mem_limit: 1g
    restart: unless-stopped

  redis:
    image: docker.io/library/redis:8.10-alpine
    container_name: culturas-redis
    # appendonly no: Redis aquí es caché y bus de pub/sub para el fan-out de
    # SSE entre instancias. Nada que viva sólo en Redis es fuente de verdad,
    # así que persistir cada escritura sería puro coste de I/O.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
    restart: unless-stopped

  minio:
    image: docker.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: culturas-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:9001
    ports:
      - "${MINIO_PORT:-9000}:9000"       # API S3
      - "${MINIO_CONSOLE_PORT:-9001}:9001"  # consola web
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    mem_limit: 512m
    restart: unless-stopped

  # Crea el bucket y lo deja con lectura pública para los objetos servidos por
  # URL directa. Corre una vez y termina; `task up` no espera por él.
  minio-init:
    image: docker.io/minio/mc:RELEASE.2025-08-13T08-35-41Z
    container_name: culturas-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing local/culturas-media
        mc anonymous set download local/culturas-media
        echo "bucket culturas-media listo"
    restart: "no"

  n8n:
    image: docker.io/n8nio/n8n:2.32.7
    container_name: culturas-n8n
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_PORT: 5678
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://localhost:5678/
      GENERIC_TIMEZONE: America/Bogota
      TZ: America/Bogota
      # n8n guarda su propio estado en Postgres, en una base aparte de la de la
      # aplicación. Compartir el servidor evita un segundo contenedor; compartir
      # la base mezclaría sus migraciones con las de Flyway.
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-culturas}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:-culturas}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_RUNNERS_ENABLED: "true"
      # La API del backend se alcanza desde el contenedor por la gateway del
      # host; en Podman rootless host.docker.internal no existe por defecto.
      CULTURAS_API_URL: http://host.containers.internal:8080
      CULTURAS_API_KEY: ${CULTURAS_API_KEY:-dev-api-key-change-me}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8ndata:/home/node/.n8n
      # Los workflows viven versionados en el repo y se importan con `task n8n:import`.
      - ./workflows:/workflows:ro
    mem_limit: 768m
    restart: unless-stopped

volumes:
  pgdata:
  miniodata:
  n8ndata:
